<!-- By Ruth Perjuste, Sophie Lin, Ashley Yang --> 
{% extends "base.html" %}

{% block main_content %}
        
    <h1 class="title">{{ title }}</h1>
    <p>{{title}}, released in {{release}}</p>
    <p>Cast:</p>

    <div class="container_list"> 
        <ol>
            {% for person in cast%}
            <li> <a href= "{{ url_for('person_lookup', nm = person.nm) }}" > {{ person.name }} </a></li>
            {% endfor %}
        </ol>
    </div>

{% endblock %}
