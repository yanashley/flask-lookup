<!DOCTYPE html>
<html>
    <head>
        <title>Database People</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        
    <h1>{{ name }}</h1>
    <h2>{{name}}, added by {{addedby}}, was born on {{birthdate}}.</h2>


    <article> 
        <ol>
            {% for movie in discography %}
            <li> <a href= "{{ url_for('movie_lookup', tt = movie.tt) }}" > {{ movie.title }} </a></li>
            {% endfor %}
        </ol>
    </article>
    </body>

</html>
